# Local development only — Postgres for running the API on the host.
# Codespaces / Dev Container: use .devcontainer/docker-compose.yml instead.
# Production: use docker/docker-compose.yaml (db + backend + cloudflared).

services:
  postgres:
    image: postgres:16
    container_name: taskflow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
